    - id: '1771208367691'
      data:
        code: "\nimport json\nimport re\n\ndef main(summary_list: list, book_id: str):\n    \"\"\"\n    Pure aggregation:\
          \ join batch summaries, build book-level overview.\n    File writing is handled by the backend (tomato_import),\
          \ not here.\n    \"\"\"\n    valid = [str(s).strip() for s in summary_list if s]\n    if not valid:\n        return\
          \ {\"final_text\": \"\", \"commit_id\": \"none\", \"latest_chapter_json\": \"{}\", \"total_count\": 0}\n\n    header\
          \ = \"# 全书总汇总（自动索引）\\n\\n\"\n    header += f\"- 段落数：{len(valid)}\\n\"\n    header += \"- 生成方式：按段落档案抽取约束；完整段落记录保留在下方。\\\
          n\\n\"\n\n    # Build overview from first and last segment\n    overview_sections = []\n    if valid:\n        first\
          \ = valid[0]\n        last = valid[-1] if len(valid) > 1 else \"\"\n        # Extract story stage from first\n \
          \       m = re.search(r\"### 故事阶段\\s*\\n(.+?)(?=\\n###|\\n##|\\Z)\", first, re.S)\n        if m:\n            overview_sections.append(f\"\
          起始阶段：{m.group(1).strip()}\")\n        # Extract from last\n        if last:\n            m = re.search(r\"### 故事阶段\\\
          s*\\n(.+?)(?=\\n###|\\n##|\\Z)\", last, re.S)\n            if m:\n                overview_sections.append(f\"当前阶段：{m.group(1).strip()}\"\
          )\n\n    # Collect all chapter ranges for coverage index\n    ranges = []\n    for seg in valid:\n        m = re.search(r\"\
          ## Batch Archive:\\s*CH(\\d+)\\s*[-–—]\\s*(\\d+)\", seg)\n        if m:\n            ranges.append((int(m.group(1)),\
          \ int(m.group(2))))\n\n    if ranges:\n        coverage = f\"覆盖范围：CH{ranges[0][0]}-CH{ranges[-1][1]}（{len(ranges)}段）\"\
          \n        overview_sections.append(coverage)\n\n    if overview_sections:\n        header += \"## 全书概览\\n\\n\"\n\
          \        for line in overview_sections:\n            header += f\"- {line}\\n\"\n        header += \"\\n---\\n\\\
          n\"\n    else:\n        header += \"---\\n\\n\"\n\n    header += \"# 分批阅读档案\\n\\n\"\n\n    full_text = header +\
          \ \"\\n\\n\".join(valid)\n\n    # Count batch archives\n    count = len(re.findall(r\"## Batch Archive:\", full_text))\n\
          \n    return {\n        \"final_text\": full_text,\n        \"commit_id\": \"deferred_to_backend\",\n        \"\
