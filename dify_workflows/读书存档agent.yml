        code: "\nimport json as _json\nimport math\nimport re\n\ndef main(raw_text: str = \"\", upload_chunks: list = None)\
          \ -> dict:\n    \"\"\"Relay node: parse raw_text OR relay upload_chunks into iteration-ready chunks.\"\"\"\n   \
          \ if upload_chunks:\n        return {\"chunks\": upload_chunks, \"total_chapters\": len(upload_chunks)}\n\n    if\
          \ not raw_text:\n        return {\"chunks\": [], \"total_chapters\": 0}\n\n    DELIMITER = \"|||CHAPTER_START|||\"\
          \n    raw_chunks = [c.strip() for c in raw_text.split(DELIMITER) if c.strip()]\n    total = len(raw_chunks)\n  \
          \  if total == 0:\n        return {\"chunks\": [], \"total_chapters\": 0}\n\n    # Larger segments for constraint\
          \ extraction (~50-100 chapters per segment)\n    batch_size = max(50, math.ceil(total / 15))\n    bundled_data =\
          \ []\n    for i in range(0, total, batch_size):\n        batch = raw_chunks[i : i + batch_size]\n        batch_chapters\
          \ = []\n        ch_nums = []\n        for content in batch:\n            lines = content.splitlines()\n        \
          \    title = lines[0].strip() if lines else \"\"\n            body = chr(10).join(lines[1:]).strip() if len(lines)\
          \ > 1 else \"\"\n            if len(body) > 300000:\n                body = body[:300000] + \"...(Truncated)\"\n\
          \            batch_chapters.append({\"title\": title, \"content\": body})\n            m = re.search(r\"第(\\d+)章\"\
          , title)\n            if m:\n                ch_nums.append(int(m.group(1)))\n        if ch_nums:\n            range_label\
          \ = \"CH{}-{}\".format(min(ch_nums), max(ch_nums))\n        else:\n            range_label = \"CH{}-{}\".format(i\
          \ + 1, min(i + batch_size, total))\n        bundled_data.append({\n            \"range\": range_label,\n       \
          \     \"chapters\": batch_chapters,\n        })\n\n    return {\"total_chapters\": total, \"chunks\": bundled_data}\n"
        desc: 接收 raw_text，按 |||CHAPTER_START||| 切片打包为 chunks
