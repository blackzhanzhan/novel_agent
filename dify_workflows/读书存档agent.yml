    - id: '1771151648936'
      data:
        code: "import requests\nimport json\nimport typing\n\ndef main(book_name: str, raw_text: list) -> dict:\n    \"\"\"\
          \n    Dify 重载传输节点：批量归档 (确定性ID版)\n    \n    功能：\n    1. 接收书名 (book_name) 和 原始内容 (raw_text)。\n    2. 调用后端 batch_import\
          \ 接口，不传 book_id。\n    3. 后端根据 book_name 自动生成确定性 ID 并自愈目录。\n    4. 返回生成的 book_id 供下游流程锁定使用。\n    \"\"\"\n    \n \
          \   # Docker 宿主机内部通信地址\n    API_URL = \"http://host.docker.internal:8000/books/batch_import\"\n    \n    # 1. 预定义默认返回结构\
          \ (兜底)\n    # 必须包含 Dify \"输出变量\" 中定义的所有字段\n    result = {\n        \"saved_count\": 0,\n        \"book_id\": \"\"\
          ,\n        \"log\": \"\"\n    }\n\n    try:\n        # 2. 简单校验\n        if not book_name:\n            result[\"\
          log\"] = \"❌ 错误: 书名(book_name) 不能为空，无法生成 ID\"\n            return result\n            \n        if not raw_text:\n\
          \            result[\"log\"] = \"⚠️ 警告: 输入文本为空，跳过归档\"\n            return result\n\n        # 3. 构造 Payload\n  \
          \      # 关键点：我们故意不传 \"book_id\"，只传 \"book_name\"\n        # 这会触发后端的 \"方案 S\"：自动计算 Hash ID + 自动建库\n        payload\
          \ = {\n            \"book_name\": book_name,\n            \"content\": raw_text  # Dify 文档提取器通常输出 List[str]\n  \
          \      }\n        \n        # 4. 发送请求 (设置 60s 超时，防止大文件写入时网络中断)\n        resp = requests.post(API_URL, json=payload,\
          \ timeout=60)\n        \n        # 5. 处理响应\n        if resp.status_code == 200:\n            res_json = resp.json()\n\
          \            \n            # 获取核心数据\n            saved_count = res_json.get(\"saved_count\", 0)\n            real_book_id\
          \ = res_json.get(\"book_id\", \"unknown_id\") # 拿到后端生成的身份证号\n            \n            # 填充成功结果\n            result[\"\
          saved_count\"] = saved_count\n            result[\"book_id\"] = real_book_id\n            result[\"log\"] = f\"\
          ✅ 归档成功! 《{book_name}》 -> ID: {real_book_id} (共 {saved_count} 章)\"\n            \n        else:\n            # 尝试解析后端返回的\
          \ JSON 错误信息\n            try:\n                err_msg = resp.json().get(\"message\", resp.text[:100])\n       \
          \     except:\n                err_msg = resp.text[:100]\n                \n            result[\"log\"] = f\"❌ 归档失败\
          \ (HTTP {resp.status_code}): {err_msg}\"\n            \n    except Exception as e:\n        # 捕获网络异常或其他代码错误\n  \
          \      result[\"log\"] = f\"❌ 网络或系统异常: {str(e)}\"\n\n    return result"
        type: code
        title: 批量归档重载传输
        outputs:
          log:
