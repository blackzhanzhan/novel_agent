        code: "import requests\nimport json\n\ndef main(raw_text: str) -> dict:\n    API_URL = \"http://host.docker.internal:8000/tools/adaptive_slice\"\
          \n    \n    # 默认返回值（兜底）\n    result = {\n        \"chunks\": [],\n        \"total_chapters\": 0,\n        \"status\"\
          : \"error\"\n    }\n\n    try:\n        # 1. 构造 Payload\n        payload = {\"arg1\": raw_text}\n        \n    \
          \    # 2. 发起请求\n        resp = requests.post(API_URL, json=payload, timeout=60)\n        \n        if resp.status_code\
          \ == 200:\n            data = resp.json()\n            # 成功覆盖\n            result[\"chunks\"] = data.get(\"data\"\
          , [])\n            result[\"total_chapters\"] = data.get(\"total_chapters\", 0)\n            result[\"status\"]\
          \ = \"success\"\n        else:\n            result[\"status\"] = f\"error: {resp.status_code}\"\n            \n\
          \    except Exception as e:\n        result[\"status\"] = f\"error: {str(e)}\"\n    \n    # 3. 统一返回（确保包含所有 key）\n\
          \    return result"
        type: code
