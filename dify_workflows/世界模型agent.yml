            排他条件：只要指令中包含“开始一本书”或“初始”且没有具体的剧情分析，就进这里。'
        - id: '2'
          name: '核心关键词：解析原文、读取章节、分析剧情、更新状态、同步变动。

            判断逻辑：凡是涉及“小说原文内容”“根据第 X 章修改”“角色在原文里做过什么”“已有设定如何约束后续”的请求，归为此类。

            注意：这是最频繁的分类，处理的是作品内部逻辑、世界模型和状态同步。'
        - id: '1771422209831'
          name: '核心关键词：联网搜索、现实考据、查证规则、地理环境、行业常识、技术限制。

            判断逻辑：凡是要求“查一下现实中...”“搜一下...”“考据...”或需要外部真实世界资料校准设定的请求，归为此类。

            注意：只把外部资料转化为可服务创作的设定边界，不替代书内事实。'
        - id: '1771426272662'
          name: '选项回应: 用户输入了极短的数字或选项词，如：“1”、“2”、“3”、“选第一项”、“A”。

            顺承语气: 用户输入了缺乏独立上下文的顺承词，如：“继续”、“好的”、“执行”、“下一步”、“接着查”、“就按这个来”。

            核心判别法: 如果你孤立地看用户的这句话，完全不知道他具体要干什么（比如只说了一个“继续”），请毫不犹豫地将其丢入本分支。系统后续的“条件分支器”会根据底层变量接管它。'
