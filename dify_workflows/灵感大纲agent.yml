                  auto: 1
                file_name:
                  auto: 1
              tool_label: get_markdown_outline
              provider_name: c41fee3b-54dd-4e49-af9b-be30f68f6242
              tool_description: 读取指定 Markdown 文件的标题结构、section_path 与 base_etag，用于安全定位和写入前校验。
              provider_show_name: LoreGit 后端工具集
            - type: api
              extra:
                description: 按范围读取书库归档内容，用于抽样核对摘要、世界观、状态和大纲证据。
              enabled: true
